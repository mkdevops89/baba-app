apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: baba-app-alloy
  namespace: argocd

spec:
  project: observability

  destination:
    server: https://kubernetes.default.svc
    namespace: observability

  # Pin the Alloy Helm chart while keeping environment-specific
  # configuration in the Baba App Git repository.
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: alloy
      targetRevision: 1.12.1
      helm:
        valueFiles:
          - $values/06-gitops/observability/alloy/values.yaml

    - repoURL: https://github.com/mkdevops89/baba-app.git
      targetRevision: main
      ref: values

    - repoURL: https://github.com/mkdevops89/baba-app.git
      targetRevision: main
      path: 06-gitops/observability/alloy/manifests

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true