apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: baba-app-observability
  namespace: argocd
spec:
  project: observability

  sources:
    # Official Prometheus Community Helm repository.
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 88.6.1
      helm:
        releaseName: baba-observability
        valueFiles:
          - $values/06-gitops/observability/prometheus/values.yaml

    # Baba App repository provides the environment-specific Helm values.
    - repoURL: https://github.com/mkdevops89/baba-app.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: observability

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true