apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: observability
  namespace: argocd
spec:
  description: GitOps project for Baba App operational observability.

  # Allow only the Baba App repository and the pinned Prometheus Community
  # Helm repository used by the observability Application.
  sourceRepos:
    - https://github.com/mkdevops89/baba-app.git
    - https://prometheus-community.github.io/helm-charts

  # Keep namespaced observability resources isolated from application and
  # Kubernetes system namespaces.
  destinations:
    - server: https://kubernetes.default.svc
      namespace: observability

  # Namespace-scoped resources required by kube-prometheus-stack.
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Secret
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount

    - group: apps
      kind: Deployment
    - group: apps
      kind: DaemonSet
    - group: apps
      kind: StatefulSet

    - group: batch
      kind: Job

    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding

    - group: monitoring.coreos.com
      kind: Prometheus
    - group: monitoring.coreos.com
      kind: Alertmanager
    - group: monitoring.coreos.com
      kind: ServiceMonitor
    - group: monitoring.coreos.com
      kind: PodMonitor
    - group: monitoring.coreos.com
      kind: PrometheusRule

  # kube-prometheus-stack requires several explicitly approved cluster-scoped
  # resources. Avoid wildcard cluster permissions.
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace

    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding

    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition

    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration