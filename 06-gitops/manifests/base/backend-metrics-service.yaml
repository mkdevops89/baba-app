apiVersion: v1
kind: Service
metadata:
  name: baba-app-backend-metrics
  labels:
    app.kubernetes.io/name: baba-app-backend-metrics
    app.kubernetes.io/part-of: baba-app
spec:
  # Metrics remain internal to the Kubernetes cluster.
  type: ClusterIP

  selector:
    app.kubernetes.io/name: baba-app-backend

  ports:
    - name: management
      port: 8081
      targetPort: management
      protocol: TCP
