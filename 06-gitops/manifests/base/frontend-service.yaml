apiVersion: v1
kind: Service
metadata:
  name: baba-app-frontend
  labels:
    app.kubernetes.io/name: baba-app-frontend
    app.kubernetes.io/part-of: baba-app
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: baba-app-frontend
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP