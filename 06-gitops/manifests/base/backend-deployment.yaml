apiVersion: apps/v1
kind: Deployment
metadata:
  name: baba-app-backend
  labels:
    app.kubernetes.io/name: baba-app-backend
    app.kubernetes.io/part-of: baba-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: baba-app-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: baba-app-backend
        app.kubernetes.io/part-of: baba-app
    spec:
      automountServiceAccountToken: false

      securityContext:
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: backend
          # The base intentionally uses a placeholder image.
          # Environment overlays replace this with the immutable ECR artifact.
          image: baba-app-backend:placeholder

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

          readinessProbe:
            httpGet:
              path: /api/products
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /api/products
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir: {}