apiVersion: apps/v1
kind: Deployment
metadata:
  name: baba-app-frontend
  labels:
    app.kubernetes.io/name: baba-app-frontend
    app.kubernetes.io/part-of: baba-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: baba-app-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: baba-app-frontend
        app.kubernetes.io/part-of: baba-app
    spec:
      automountServiceAccountToken: false

      securityContext:
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: frontend
          # The base intentionally uses a placeholder image.
          # Environment overlays replace this with the immutable ECR artifact.
          image: baba-app-frontend:placeholder

          ports:
            - name: http
              containerPort: 3000
              protocol: TCP

          securityContext:
            # Distroless :nonroot images use an unprivileged high-numbered identity.
            # Declaring it explicitly prevents accidental execution as a host-like UID
            # and makes the runtime identity enforceable by Kubernetes.
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

          readinessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir: {}