apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: baba-app-backend
  namespace: observability
  labels:
    app.kubernetes.io/name: baba-app-backend
    app.kubernetes.io/part-of: baba-app
spec:
  # Discover the Baba App backend Service in the application namespace.
  namespaceSelector:
    matchNames:
      - baba-app

  # Match the labels already defined on the backend ClusterIP Service.
  selector:
    matchLabels:
      app.kubernetes.io/name: baba-app-backend-metrics

  endpoints:
    - port: management
      path: /actuator/prometheus
      interval: 30s
      scrapeTimeout: 10s
      scheme: http
