# -----------------------------------------------------------------------------
# Baba App Backend Service
# -----------------------------------------------------------------------------
# Provides an internal stable DNS name and ClusterIP for the backend pods.
# The service is intentionally not exposed directly to the public internet.

apiVersion: v1
kind: Service
metadata:
  name: baba-app-backend
  namespace: baba-app

spec:
  type: ClusterIP

  selector:
    app: baba-app-backend

  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080