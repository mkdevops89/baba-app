# -----------------------------------------------------------------------------
# Baba App Frontend Deployment
# -----------------------------------------------------------------------------
# Runs the Baba App frontend on EKS using the AMD64 image stored in ECR.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: baba-app-frontend
  namespace: baba-app
  labels:
    app: baba-app-frontend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: baba-app-frontend

  template:
    metadata:
      labels:
        app: baba-app-frontend

    spec:
      # -----------------------------------------------------------------------
      # Pod Security Context
      # -----------------------------------------------------------------------
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault

      # The frontend does not require Kubernetes API credentials.
      automountServiceAccountToken: false

      # Provides writable temporary storage while keeping the
      # container root filesystem read-only.
      volumes:
        - name: tmp
          emptyDir: {}

      containers:
        - name: frontend

          # Phase 04 frontend image built for the EKS AMD64 worker nodes.
          image: 406312601212.dkr.ecr.us-east-1.amazonaws.com/baba-app-dev-frontend@sha256:cdff0a38564cd8c74c8c2f00c3142926ffb8c9c8ab709d905f80fa6b25ad0297

          imagePullPolicy: Always

          ports:
            - containerPort: 3000
              protocol: TCP

                    # Readiness probe
          # Uses /login because the root route intentionally redirects there.
          readinessProbe:
            httpGet:
              path: /login
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          # Liveness probe
          # Verifies the Next.js application remains responsive.
          livenessProbe:
            httpGet:
              path: /login
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: tmp
              mountPath: /tmp

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"