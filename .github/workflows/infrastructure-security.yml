name: Infrastructure Security

on:
  pull_request:
    branches:
      - main
    paths:
      - "03-terraform/**"
      - "04-eks/**"
      - "06-gitops/**"
      - ".github/workflows/infrastructure-security.yml"
      - ".github/workflows/infrastructure-lifecycle.yml"

  push:
    branches:
      - "feature/**"
      - "security/**"
    paths:
      - "03-terraform/**"
      - "04-eks/**"
      - "06-gitops/**"
      - ".github/workflows/infrastructure-security.yml"
      - ".github/workflows/infrastructure-lifecycle.yml"

permissions:
  contents: read

concurrency:
  group: infrastructure-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform-checkov:
    name: Terraform - Checkov
    runs-on: ubuntu-latest

    steps:
      # Retrieve repository content for infrastructure security validation.
      - name: Checkout repository
        uses: actions/checkout@v5

      # Scan Terraform configuration for security and compliance misconfigurations.
      # Reviewed exceptions are scoped to known development-environment architecture
      # decisions or scanner-policy limitations. All other findings remain blocking.
      - name: Run Checkov against Terraform
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: 03-terraform/environments/dev
          framework: terraform
          var_file: 03-terraform/environments/dev/terraform.tfvars.example
          skip_check: CKV_AWS_39,CKV_AWS_58,CKV_AWS_339,CKV_AWS_109,CKV_AWS_111,CKV_AWS_356
          quiet: true
          soft_fail: false

  terraform-trivy:
    name: Terraform - Trivy
    runs-on: ubuntu-latest

    steps:
      # Retrieve repository content for infrastructure security validation.
      - name: Checkout repository
        uses: actions/checkout@v5

      # Scan Terraform files and fail when HIGH or CRITICAL misconfigurations are detected.
      - name: Run Trivy against Terraform
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: 03-terraform/environments/dev
          trivy-config: 05-cicd/trivy-ci.yaml
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: false

  kubernetes-checkov:
    name: Kubernetes - Checkov
    runs-on: ubuntu-latest

    steps:
      # Retrieve repository content for Kubernetes manifest validation.
      - name: Checkout repository
        uses: actions/checkout@v5

      # Install the kubectl version aligned with the Baba App EKS platform.
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.36.3"

      # Render the development overlay so Checkov evaluates the same namespace,
      # immutable image digests, and environment configuration that Argo CD deploys.
      - name: Render GitOps development manifests
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p .security-rendered

          kubectl kustomize 06-gitops/manifests/overlays/dev \
            > .security-rendered/gitops-dev.yaml

      # CKV2_K8S_6 is intentionally deferred to Phase 14, where Kubernetes
      # NetworkPolicies will be implemented.
      #
      # CKV_K8S_15 is accepted because Baba App deploys immutable SHA256 image
      # digests, so image integrity does not depend on imagePullPolicy: Always.
      - name: Run Checkov against rendered GitOps manifests
        uses: bridgecrewio/checkov-action@v12
        with:
          file: .security-rendered/gitops-dev.yaml
          framework: kubernetes
          skip_check: CKV2_K8S_6,CKV_K8S_15
          quiet: true
          soft_fail: false

  kubernetes-trivy:
    name: Kubernetes - Trivy
    runs-on: ubuntu-latest

    steps:
      # Retrieve repository content for Kubernetes manifest validation.
      - name: Checkout repository
        uses: actions/checkout@v5

      # Install the kubectl version aligned with the Baba App EKS platform.
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.36.3"

      # Jobs run on separate runners, so Trivy must render its own copy of the
      # GitOps development manifests rather than relying on the Checkov job.
      - name: Render GitOps development manifests
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p .security-rendered

          kubectl kustomize 06-gitops/manifests/overlays/dev \
            > .security-rendered/gitops-dev.yaml

      # Scan the exact rendered configuration rather than reusable base manifests.
      - name: Run Trivy against rendered GitOps manifests
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .security-rendered/gitops-dev.yaml
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: false