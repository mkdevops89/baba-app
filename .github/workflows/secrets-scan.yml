name: Secrets Scan

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - "feature/**"

permissions:
  contents: read

concurrency:
  group: secrets-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest

    steps:
      # Retrieve the full repository history so Gitleaks can inspect committed changes accurately.
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Scan the repository and fail the workflow if a potential secret is detected.
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
