name: Secrets Scan

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - "feature/**"
      - "security/**"

permissions:
  contents: read

concurrency:
  group: secrets-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest

    steps:
      # Retrieve the full repository history so Gitleaks can inspect committed changes accurately.
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Scan the repository and fail the workflow if a potential secret is detected.
      # The GitHub token authenticates API requests and avoids unauthenticated
      # runner rate limits. PR comments are disabled because this workflow is
      # used as a blocking security gate rather than a notification mechanism.
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
