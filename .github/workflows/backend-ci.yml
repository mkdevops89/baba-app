name: Backend CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "01-application/backend/**"
      - ".github/workflows/backend-ci.yml"

  push:
    branches:
      - "feature/**"
    paths:
      - "01-application/backend/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-build-test:
    name: Backend Build and Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: 01-application/backend

    steps:
      # Pull the repository content required for the backend build.
      - name: Checkout repository
        uses: actions/checkout@v5

      # Use the same Java major version as the Baba App backend and cache Maven dependencies.
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: 01-application/backend/pom.xml

      # Validate that the Maven project compiles successfully before running tests.
      - name: Compile backend
        run: mvn --batch-mode --no-transfer-progress clean compile

      # Run the backend test suite as a required CI gate.
      - name: Run backend tests
        run: mvn --batch-mode --no-transfer-progress test

      # Package the Spring Boot application without re-running tests already executed above.
      - name: Package backend
        run: mvn --batch-mode --no-transfer-progress package -DskipTests
