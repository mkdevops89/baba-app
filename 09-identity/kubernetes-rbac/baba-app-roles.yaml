apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: baba-app-developer
  namespace: baba-app
rules:
  # Developers can inspect and manage application workloads inside only
  # the Baba App namespace. Cluster-wide administration is intentionally
  # excluded to preserve least privilege.
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - services
      - configmaps
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: baba-app-readonly
  namespace: baba-app
rules:
  # Read-only users can inspect application state and logs but cannot
  # modify workloads or access sensitive namespace resources.
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - services
      - configmaps
    verbs:
      - get
      - list
      - watch

  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
    verbs:
      - get
      - list
      - watch