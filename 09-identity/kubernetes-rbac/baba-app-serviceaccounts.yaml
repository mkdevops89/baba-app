apiVersion: v1
kind: ServiceAccount
metadata:
  name: baba-app-backend
  namespace: baba-app

# The application does not need direct Kubernetes API access.
# Disable automatic token mounting to reduce credential exposure.
automountServiceAccountToken: false

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: baba-app-frontend
  namespace: baba-app

automountServiceAccountToken: false